name: build and checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Build, translations and protocol self-test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: dotnet build AIOScreen.csproj -c Release

      # Fails when a UI string does not go through Idioma.T(). Without this the
      # phrase shows up in Portuguese inside a translated interface, and the
      # only way to notice is to look at a screenshot.
      - name: No UI string bypasses the translator
        run: python tools/textos.py auditar

      # Fails on a missing {0}, an altered file-dialog wildcard, or an acronym
      # (CPU, GPU, RAM) lowercased by a translation. A stray placeholder throws
      # a formatting exception at runtime.
      - name: Languages match the source
        run: python tools/conferir.py

      # The source dictionary is generated from the code. If it changes here,
      # someone edited a string and forgot to re-extract — leaving all 23
      # translations behind.
      - name: Source dictionary is up to date
        shell: bash
        run: |
          python tools/textos.py extrair
          git diff --exit-code languages/pt-BR.json || {
            echo
            echo 'languages/pt-BR.json is stale.'
            echo 'Run: python tools/textos.py extrair'
            exit 1
          }

      # Compares generated packets against bytes captured from the real wire.
      # This is what guards the reverse-engineered protocol against a refactor
      # that looks harmless and silently changes a byte.
      - name: Protocol self-test against real captures
        run: |
          dotnet build AIOScreen.csproj -c Debug
          ./bin/Debug/net8.0-windows/AIOScreen.exe --autoteste
